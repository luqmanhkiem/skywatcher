[pytest]
# Run from the backend/ directory so `import models`, `import auth` resolve.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    timing: real-time / time-requirement (performance) test cases
    functional: correctness test cases
    live: tests that require a running API server + Supabase (skipped by default)
