# Render Blueprint for the SkyWatcher backend (Flask API + MQTT subscriber).
# Deploy: push to GitHub, then in Render choose "New +" > "Blueprint" and pick
# this repo. Fill in the secret env vars (marked sync:false) when prompted.
#
# NOTE: a single process is used on purpose. app.py starts the MQTT subscriber
# in a background thread and seeds the database on startup, so we must NOT run
# multiple gunicorn workers (that would create duplicate MQTT subscribers).
services:
  - type: web
    name: skywatcher-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python app.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # --- Supabase (from your Supabase project settings > API) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      - key: JWT_EXPIRY_HOURS
        value: "8"
      # --- Anomaly detection ---
      - key: ANOMALY_STALL_THRESHOLD_MINUTES
        value: "20"
      # --- MQTT broker (HiveMQ Cloud) ---
      - key: MQTT_HOST
        sync: false                  # e.g. xxxx.s1.eu.hivemq.cloud
      - key: MQTT_PORT
        value: "8883"
      - key: MQTT_TOPIC
        value: baggage/events
      - key: MQTT_USER
        sync: false
      - key: MQTT_PASS
        sync: false
      - key: MQTT_USE_TLS
        value: "true"
      # --- Email alerts (optional; leave unset to disable) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
